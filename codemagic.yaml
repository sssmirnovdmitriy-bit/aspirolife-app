workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic CI/CD
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.aspiroapp.aspirolife"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Reassemble source archive if split into parts
        script: |
          if ls app-source.zip.*.part >/dev/null 2>&1; then
            cat app-source.zip.*.part > app-source.zip
          fi
      - name: Unzip project source
        script: |
          unzip -o app-source.zip -d .
      - name: Fix syncfusion_flutter_pdfviewer version
        script: |
          flutter pub add syncfusion_flutter_pdfviewer:^31.1.21
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up keychain to be used for codesigning
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Set version
        script: |
          cd ios
          agvtool new-marketing-version 1.0.12
          agvtool new-version -all $BUILD_NUMBER
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --build-name=1.0.12 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - android_signing
        - google_play_publishing
      vars:
        BUNDLE_ID: "com.aspiroapp.aspirolife"
      flutter: stable
    scripts:
      - name: Reassemble source archive if split into parts
        script: |
          if ls app-source.zip.*.part >/dev/null 2>&1; then
            cat app-source.zip.*.part > app-source.zip
          fi
      - name: Unzip project source
        script: |
          unzip -o app-source.zip -d .
      - name: Fix syncfusion_flutter_pdfviewer version
        script: |
          flutter pub add syncfusion_flutter_pdfviewer:^31.1.21
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Set up Android keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/aspirolife-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../aspirolife-release-key.jks
          EOF
      - name: Flutter build appbundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - flutter_drive.log
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false
